<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خزر استوک | بورس لوازم استوک خودروهای سواری و باری</title>

  <!-- فونت وزیر متن و فونت‌آوسام -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-orange: #f56e00;
      --primary-dark-orange: #dc5f00;
      --bg-main: #121316;
      --bg-secondary: #1a1c22;
      --card-bg: rgba(28, 30, 36, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-light: #ffffff;
      --text-gray: #b0b4bc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      direction: rtl;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ================= 1. نوار سربرگ ثابت (Sticky Header) ================= */
    .site-header {
      width: 100%;
      background: #141518;
      border-bottom: 2px solid var(--primary-orange);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .logo-text-white {
      color: #fff;
      font-size: 26px;
      font-weight: 900;
    }

    .logo-badge-orange {
      background-color: var(--primary-orange);
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(245, 110, 0, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-link {
      color: #e0e0e0;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      transition: color 0.25s;
    }

    .nav-link:hover {
      color: var(--primary-orange);
    }

    /* ================= 2. بنر شاخص بالای صفحه ================= */
    .top-banner-wrapper {
      max-width: 800px;
      margin: 25px auto 15px;
      padding: 0 15px;
      text-align: center;
    }

    .top-banner-img {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      display: block;
    }

    /* ================= 3. بخش هیرو: اسلایدر + متن ================= */
    .hero-section {
      max-width: 1200px;
      margin: 25px auto 35px;
      padding: 0 20px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 30px;
      align-items: center;
    }

    .slider-box {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(245, 110, 0, 0.4);
      background-color: #1a1a1a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, transparent 100%);
      color: #fff;
      padding: 14px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
    }

    .slider-indicators {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .ind-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.3s;
    }

    .ind-dot.active {
      width: 22px;
      border-radius: 10px;
      background: var(--primary-orange);
    }

    .hero-intro {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .intro-badge {
      display: inline-block;
      background: rgba(245, 110, 0, 0.15);
      color: var(--primary-orange);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid rgba(245, 110, 0, 0.3);
      margin-bottom: 12px;
    }

    .hero-intro h1 {
