<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خزر استوک | بورس لوازم استوک خودروهای سواری و باری</title>

  <!-- فونت وزیر متن و فونت‌آوسام -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-orange: #f56e00;
      --primary-dark-orange: #dc5f00;
      --bg-main: #121316;
      --bg-secondary: #1a1c22;
      --card-bg: rgba(28, 30, 36, 0.95);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-light: #ffffff;
      --text-gray: #b0b4bc;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* استایل‌های اصلی پاپ‌آپ و دکمه‌های شناور */
    .floating-actions {
      position: fixed;
      bottom: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 2000;
    }

    .float-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s, background-color 0.25s;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    .float-icon:hover {
      transform: scale(1.1);
    }

    .btn-float-phone {
      background: #191b22;
      border: 2px solid var(--primary-orange);
      color: var(--primary-orange);
      font-size: 20px;
    }
    .btn-float-phone:hover {
      background: var(--primary-orange);
      color: #fff;
    }

    .btn-float-wa { background: #25d366; }
    .btn-float-eitaa { background: #e66000; }
    .btn-float-bale { background: #00a693; }

    .popup-phones {
      position: fixed;
      bottom: 90px;
      left: 25px;
      background: #181920;
      border: 1px solid var(--primary-orange);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      z-index: 2100;
      min-width: 210px;
    }

    .popup-phones.show {
      display: flex;
    }

    .phone-opt {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .phone-opt:hover {
      background: rgba(245, 110, 0, 0.15);
      color: var(--primary-orange);
    }

    /* ریسپانسیو موبایل */
    @media (max-width: 850px) {
      .header-inner { flex-direction: column; gap: 12px; }
      .nav-links { gap: 14px; flex-wrap: wrap; justify-content: center; }
      .floating-actions { bottom: 15px; left: 15px; gap: 10px; }
      .float-icon { width: 44px; height: 44px; font-size: 14px; }
      .popup-phones { bottom: 75px; left: 15px; min-width: 190px; }
    }
  </style>
</head>
<body>

  <!-- هدر ثابت سایت -->
  <header style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 15px 20px; position: sticky; top: 0; z-index: 1000;">
    <div class="header-inner" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
      <h1 style="color: var(--primary-orange); font-size: 22px;">خزر استوک</h1>
      <nav class="nav-links" style="display: flex; gap: 20px; font-size: 14px;">
        <a href="#parts" style="color: #fff; text-decoration: none;">قطعات و خودروها</a>
        <a href="#contact" style="color: #fff; text-decoration: none;">تماس با ما</a>
      </nav>
    </div>
  </header>

  <!-- محتوای اصلی صفحه -->
  <main style="max-width: 1200px; margin: 40px auto; padding: 0 20px; text-align: center;">
    <h2 style="font-size: 28px; margin-bottom: 15px;">سامانه جامع استعلام لوازم استوک خودرو</h2>
    <p style="color: var(--text-gray); margin-bottom: 30px;">جهت استعلام قطعات، قیمت روز با احتساب ۵٪ کارمزد و دسته‌بندی خودروها از منوی زیر استفاده کنید.</p>
  </main>

  <!-- پنجره پاپ‌آپ تماس و پیام‌رسان‌ها -->
  <div class="popup-phones" id="contactPopup">
    <div style="font-size: 12px; color: #aaa; margin-bottom: 4px; text-align: center;">ارتباط با مدیریت و سفارش</div>
    <button class="phone-opt" onclick="openEitaa()">
      <span>پیام‌رسان ایتا</span>
      <span style="color: #e66000;">●</span>
    </button>
    <button class="phone-opt" onclick="openBale()">
      <span>پیام‌رسان بله</span>
      <span style="color: #00a693;">●</span>
    </button>
    <button class="phone-opt" onclick="callDirect()">
      <span>تماس مستقیم</span>
      <span style="color: #f56e00;">📞</span>
    </button>
  </div>

  <!-- دکمه‌های شناور گوشه صفحه -->
  <div class="floating-actions">
    <button class="float-icon btn-float-phone" onclick="toggleContactPopup()" title="راه‌های ارتباطی">
      📞
    </button>
    <button class="float-icon btn-float-eitaa" onclick="openEitaa()" title="ارتباط در ایتا">
      ایتا
    </button>
    <button class="float-icon btn-float-bale" onclick="openBale()" title="ارتباط در بله">
      بله
    </button>
  </div>

  <script>
    function toggleContactPopup() {
      const pop = document.getElementById('contactPopup');
      if (pop) pop.classList.toggle('show');
    }

    document.addEventListener('click', function(e) {
      const pop = document.getElementById('contactPopup');
      const btn = document.querySelector('.btn-float-phone');
      if (pop && btn && !pop.contains(e.target) && !btn.contains(e.target)) {
        pop.classList.remove('show');
      }
    });

    const _c = ["0939", "018", "9270"].join("");

    function openEitaa() {
      window.open("https://eitaa.com/" + _c, "_blank");
    }

    function openBale() {
      window.open("https://ble.ir/" + _c, "_blank");
    }

    function callDirect() {
      window.location.href = "tel:" + _c;
    }
  </script>

</body>
</html>
