<!-- خودروهای داخلی -->
<section class="category-section" id="domestic">
    <div class="section-title">
        <i class="fa-solid fa-car-side"></i>
        <h2>خودروهای داخلی (ایرانی)</h2>
    </div>
    
    <div class="sub-group">
        <span class="group-title">محصولات ایران‌خودرو (IKCO)</span>
        <div class="car-grid">
            <!-- اضافه کردن data-car برای تعامل با JS -->
            <button class="car-card" onclick="showParts('206')">پژو ۲۰۶ / ۲۰۷</button>
            <button class="car-card" onclick="showParts('405')">پژو پارس / ۴۰۵</button>
            <button class="car-card" onclick="showParts('samand')">سمند / سورن / دنا</button>
        </div>
    </div>

    <!-- کانتینر قطعات: ابتدا پنهان است و با کلیک روی دکمه ظاهر می‌شود -->
    <div id="parts-container" class="parts-container" style="display: none;">
        <h3 id="selected-car-title" style="margin-bottom: 15px; color: #fff;">قطعات موجود برای: ...</h3>
        <div class="parts-grid-display" id="parts-list">
            <!-- قطعات اینجا توسط JS لود می‌شوند -->
        </div>
    </div>
</section>
