<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
    body { background: #121212; color: #fff; font-family: Tahoma, sans-serif; padding: 20px; }
    .category-section { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #f56e00; }
    .car-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
    .car-card { background: #f56e00; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .car-card:hover { background: #d95e00; }
</style>
</head>
<body>
    <section class="category-section">
        <h2>خودروهای داخلی (ایرانی)</h2>
        <div class="car-grid">
            <button class="car-card">پژو ۲۰۶ / ۲۰۷</button>
            <button class="car-card">پژو پارس / ۴۰۵</button>
            <button class="car-card">سمند / دنا</button>
            <button class="car-card">رنو تندر ۹۰</button>
        </div>
    </section>
</body>
</html>
