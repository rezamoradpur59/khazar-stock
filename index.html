<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزر استوک - فروش قطعات خودرو</title>
    <style>
        /* استایل‌های پایه و گلس‌مورفیسم */
        :root { --main-orange: #f56e00; --bg-black: #121212; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: var(--bg-black); color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border: 1px solid var(--main-orange); }
        .category-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { background: var(--main-orange); border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background: #d45e00; }
        .contact-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; border-right: 5px solid var(--main-orange); }
        .fab { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 15px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: var(--main-orange);">خزر استوک</h1>
    
    <!-- دکمه‌های دسته‌بندی -->
    <div class="category-nav">
        <button onclick="showCategory('iranian')">خودروهای داخلی</button>
        <button onclick="showCategory('foreign')">خودروهای خارجی</button>
    </div>

    <!-- محل نمایش قطعات -->
    <div id="display-area" style="text-align: center; padding: 20px;">
        <h3>لطفاً دسته بندی مورد نظر را انتخاب کنید</h3>
    </div>

    <!-- بخش تماس‌ها (مطابق درخواست شما) -->
    <div class="contact-card" id="contact">
        <h3>تماس با مدیریت و پشتیبانی</h3>
        <p>مدیریت: ۰۹۱۱۴۵۳۸۷۴۰</p>
        <p>پشتیبانی و واتس‌اپ: ۰۹۳۹۷۲۳۵۹۷۰</p>
        <p>تلفن ثابت: ۰۱۱-۵۲۳۳۱۶۴۳</p>
        <p>اینستاگرام: <a href="#" style="color: var(--main-orange);">stock_khazar</a></p>
    </div>
</div>

<!-- دکمه واتس‌اپ -->
<a href="https://wa.me/989397235970" class="fab">💬 واتس‌اپ</a>

<script>
    // منطق نمایش قطعات
    function showCategory(cat) {
        const area = document.getElementById('display-area');
        if(cat === 'iranian') {
            area.innerHTML = `<h3>لیست قطعات خودروهای داخلی</h3>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                <button>پژو پارس</button><button>سمند</button><button>دنا</button>
            </div>`;
        } else {
            area.innerHTML = `<h3>لیست قطعات خودروهای خارجی</h3>
            <p>در حال بروزرسانی...</p>`;
        }
    }
</script>

</body>
</html>
